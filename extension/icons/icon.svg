<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- kaiwu favicon「方塊容器版」：V5 打勾構成 K 置於暗底圓角方塊。
       容器解決 2026-07-20 記下的取捨——無容器版在淺底分頁列灰腿對比僅約 4:1，
       16px 下幾乎消失。容器色沿用 apple-icon 的 #0A0A0B：實測比 #18181B 好，
       在白底與 Chrome/Safari 暗分頁列（#35363A / #2C2C2E）兩端都保有邊界。
       標記高度佔容器 80%（原始 bbox x28–74 / y14–86，scale 1.1111 後置中）；
       0.86 會頂到圓角，0.72 以下 16px 顯得空。品牌紅/灰為固定色，不隨主題變。 -->
  <rect width="100" height="100" rx="22" fill="#0A0A0B"/>
  <g transform="translate(-6.67,-5.56) scale(1.1111)">
    <polygon points="28,14 42,14 45,50 70,14 70,34 34,86" fill="#B00D23"/>
    <polygon points="48,72 56,61 74,86 58,86" fill="#71717A"/>
  </g>
